# Development stack. Reads .env. For production use docker-compose.prod.yml,
# which reads only .env.production.
name: paytrack

x-app: &app
  build: .
  image: paytrack:dev
  env_file: .env
  environment:
    KAFKA_BROKERS: kafka:9092
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  kafka:
    image: apache/kafka:3.9.0
    ports: ["127.0.0.1:9719:9719"] # host-local only; never expose Kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9719
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9719
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  migrate:
    build: .
    image: paytrack:dev
    command: ["migrate"]
    env_file: .env

  api:
    <<: *app
    command: ["api"]
    ports: ["${API_HOST_PORT:-9710}:9710"]

  callback:
    <<: *app
    command: ["callback"]
    ports: ["${CALLBACK_HOST_PORT:-9711}:9711"]

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

volumes:
  kafkadata:
