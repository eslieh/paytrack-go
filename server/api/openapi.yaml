openapi: 3.1.0
info:
  title: PayTrack API
  version: 1.0.0
  description: |
    Multi-tenant M-Pesa STK push routing.

    **Auth**: `Authorization: Bearer <token>` where token is either
    - a dashboard access token (15 min) from sign-in, or
    - an API key (`ptk_...`) for tenant backends.

    **Dashboard sessions** are revocable. Sign-in responses return a short-lived
    access token in JSON and set an httpOnly `pt_refresh` cookie; `POST /v1/auth/refresh`
    exchanges the cookie for a new access token (the cookie rotates on every use).
    The dashboard calls the API through its own `/api` proxy so cookies are first-party.
    Password sign-ins on an untrusted device require an emailed 6-digit code
    (`mfa_required`); `remember_device` sets a 30-day `pt_device` cookie.

    Endpoints marked *user session only* reject API keys with 403. Endpoints marked
    *verified* reject dashboard sessions whose email is not verified (`email_not_verified`).
    A suspended account's API keys are rejected with 403 `tenant_suspended`. Its dashboard
    sessions stay read-only: writes other than `/v1/auth/*`, `/v1/me/*`, `/v1/support/*` and `/v1/notifications/*` return 403
    `tenant_suspended`. Disabled users get 403 `account_disabled` when signing in.
    Sign-in, code, reset and sign-up endpoints are rate limited (429 `rate_limited`).

    **Errors** always use `{"error": {"code", "message", "request_id"}}`.

    **Pagination**: list endpoints return `{data, has_more, next_cursor}`; pass
    `cursor=<next_cursor>` to fetch the next (older) page. Newest first.

    **Webhooks**: PayTrack POSTs a `PaymentEvent` to your webhook URL with headers
    `PayTrack-Event-Id`, `PayTrack-Event-Type`, `PayTrack-Delivery-Id` and
    `PayTrack-Signature: t=<unix>,v1=<hex HMAC-SHA256(signing_secret, "<t>.<raw body>")>`.
    Verify the signature, reject timestamps older than 5 minutes, dedupe on event id,
    and respond 2xx within 10s. Non-2xx responses are retried for ~16h.
servers:
  - url: http://localhost:9710
security:
  - bearer: []

paths:
  /v1/auth/providers:
    get:
      tags: [auth]
      summary: Available sign-in methods
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { password: { type: boolean }, google: { type: boolean } } } } } }

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Create a tenant and its owner (unverified) and sign in
      description: Emails a verification link. Unverified users can sign in but cannot create API keys, channels or payments.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_name, email, password]
              properties:
                business_name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                password: { type: string, minLength: 10, maxLength: 72 }
      responses:
        "201": { description: Signed in (sets pt_refresh cookie), content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } }
      responses:
        "200":
          description: A session, or an email-code challenge when two-step applies
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Session"
                  - type: object
                    properties:
                      mfa_required: { type: boolean, const: true }
                      challenge: { $ref: "#/components/schemas/Challenge" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /v1/auth/login/verify:
    post:
      tags: [auth]
      summary: Complete two-step sign-in with the emailed code
      description: 5 wrong attempts invalidate the challenge; codes expire after 10 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: { type: string }
                code: { type: string, pattern: "^\\d{6}$" }
                remember_device: { type: boolean, description: Skip codes on this browser for 30 days }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "422": { $ref: "#/components/responses/Error" }

  /v1/auth/login/resend:
    post:
      tags: [auth]
      summary: Email a new sign-in code (30s cooldown, max 5 per challenge)
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [challenge_id], properties: { challenge_id: { type: string } } } } }
      responses:
        "200": { description: Sent, content: { application/json: { schema: { type: object, properties: { challenge: { $ref: "#/components/schemas/Challenge" } } } } } }
        "422": { $ref: "#/components/responses/Error" }

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Exchange the pt_refresh cookie for a new access token
      description: Rotates the cookie. 409 `refresh_race` means another tab refreshed at the same moment; retry once.
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session and clear the cookie
      description: Accepts the access token, or just the refresh cookie when the access token has expired.
      responses:
        "204": { description: Signed out }

  /v1/auth/verify-email:
    post:
      tags: [auth]
      summary: Redeem an email verification link (sends the welcome email)
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } }
      responses:
        "200": { description: Verified, content: { application/json: { schema: { type: object, properties: { email_verified: { type: boolean }, email: { type: string } } } } } }
        "422": { $ref: "#/components/responses/Error" }

  /v1/auth/verify-email/resend:
    post:
      tags: [auth]
      summary: Email a new verification link (user session only)
      responses:
        "202": { description: Sent }
        "409": { $ref: "#/components/responses/Error" }

  /v1/auth/password/forgot:
    post:
      tags: [auth]
      summary: Email a password reset link
      description: Always returns 202 so it can't be used to discover accounts.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } }
      responses:
        "202": { description: Accepted }

  /v1/auth/password/reset:
    post:
      tags: [auth]
      summary: Set a new password from a reset link and sign in
      description: Revokes every session and trusted device, and emails a confirmation.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 10 } } } } }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "422": { $ref: "#/components/responses/Error" }

  /v1/auth/google/start:
    get:
      tags: [auth]
      summary: Begin Google sign-in (browser navigation)
      description: |
        302 to Google. Google returns to `<origin>/api/v1/auth/google/callback`, which signs in
        (302 to `next`), starts sign-up (302 to `/auth/google/complete?token=`), or reports an
        error (302 to `/auth?error=<code>`).
      security: []
      parameters:
        - { name: next, in: query, schema: { type: string, default: /dashboard } }
        - { name: origin, in: query, description: Dashboard origin to return to (must be allow-listed), schema: { type: string } }
      responses:
        "302": { description: Redirect to Google }

  /v1/auth/google/signup:
    get:
      tags: [auth]
      summary: Pending Google sign-up details
      security: []
      parameters: [{ name: token, in: query, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { email: { type: string }, name: { type: string } } } } } }
        "422": { $ref: "#/components/responses/Error" }

  /v1/auth/google/complete:
    post:
      tags: [auth]
      summary: Finish Google sign-up by naming the business
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, business_name], properties: { token: { type: string }, business_name: { type: string } } } } }
      responses:
        "201": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }

  /v1/me:
    get:
      tags: [account]
      summary: Current tenant, user and linked sign-in methods
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant: { $ref: "#/components/schemas/Tenant" }
                  user: { oneOf: [{ $ref: "#/components/schemas/User" }, { type: "null" }] }
                  auth_kind: { type: string, enum: [user, api_key] }
                  identities: { type: array, items: { type: object, properties: { provider: { type: string }, email: { type: string }, linked_at: { type: string, format: date-time } } } }
                  google_enabled: { type: boolean }

  /v1/me/password:
    post:
      tags: [account]
      summary: Change (or, for Google-only accounts, set) the password (user session only)
      description: Signs out other sessions and emails a confirmation.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [new_password], properties: { current_password: { type: string }, new_password: { type: string, minLength: 10 } } } } }
      responses:
        "204": { description: Changed }
        "422": { $ref: "#/components/responses/Error" }

  /v1/me/two-step:
    put:
      tags: [account]
      summary: Turn email two-step sign-in on or off (user session only)
      description: Turning it off requires the password and emails an alert.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean }, password: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { two_step_enabled: { type: boolean } } } } } }

  /v1/me/sessions:
    get:
      tags: [account]
      summary: Active sessions (user session only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        device: { type: string, example: Chrome on macOS }
                        ip: { type: string }
                        auth_method: { type: string }
                        created_at: { type: string, format: date-time }
                        last_seen_at: { type: string, format: date-time }
                        expires_at: { type: string, format: date-time }
                        current: { type: boolean }
  /v1/me/sessions/{id}:
    delete:
      tags: [account]
      summary: Sign out one session
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Revoked }
  /v1/me/sessions/revoke-others:
    post:
      tags: [account]
      summary: Sign out every other session and forget trusted devices
      responses:
        "204": { description: Revoked }

  /v1/me/security-events:
    get:
      tags: [account]
      summary: Recent security activity (audit log)
      parameters: [{ $ref: "#/components/parameters/limit" }]
      responses:
        "200": { description: OK }

  /v1/me/identities/google:
    post:
      tags: [account]
      summary: Start linking Google to the signed-in user
      description: Returns the Google URL to navigate to; Google returns to `/dashboard/settings?google=linked`.
      requestBody:
        content: { application/json: { schema: { type: object, properties: { origin: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { url: { type: string } } } } } }
    delete:
      tags: [account]
      summary: Unlink Google (requires a password on the account)
      responses:
        "204": { description: Unlinked }
        "422": { $ref: "#/components/responses/Error" }

  /v1/onboarding:
    get:
      tags: [account]
      summary: Setup checklist computed from the account's real data
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  complete: { type: boolean }
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, enum: [verify_email, channel, api_key, webhook, first_payment] }
                        label: { type: string }
                        done: { type: boolean }
                        href: { type: string }

  /v1/settings/notifications:
    get:
      tags: [settings]
      summary: Email notification settings (user session only)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationSettings" } } } }
    put:
      tags: [settings]
      summary: Update notification settings (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_receipts: { type: boolean, description: Email the merchant a receipt for every successful payment }
                receipt_email: { type: string, description: "Where receipts and alerts go; empty = owner email" }
                webhook_failure_alerts: { type: boolean }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationSettings" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/settings/notifications/preview:
    get:
      tags: [settings]
      summary: Render a notification email with sample data and your business name
      parameters: [{ name: template, in: query, schema: { type: string, enum: [payment_receipt, first_payment, webhook_failing], default: payment_receipt } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { subject: { type: string }, html: { type: string }, text: { type: string } } } } } }
  /v1/settings/notifications/test-receipt:
    post:
      tags: [settings]
      summary: Email a sample receipt to the receipt recipient
      responses:
        "202": { description: Queued, content: { application/json: { schema: { type: object, properties: { sent_to: { type: string } } } } } }

  /v1/api-keys:
    get:
      tags: [api-keys]
      summary: List API keys (user session only)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/APIKeyList" } } } }
    post:
      tags: [api-keys]
      summary: Create an API key (user session only, verified). The `key` is returned only once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/APIKey" } } } }
  /v1/api-keys/{id}:
    delete:
      tags: [api-keys]
      summary: Revoke an API key (user session only)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }

  /v1/banks:
    get:
      tags: [channels]
      summary: Banks available as bank-channel destinations
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Bank" } } } }

  /v1/channels:
    get:
      tags: [channels]
      summary: List channels
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Channel" } } } }
    post:
      tags: [channels]
      summary: Register a payment destination (verified)
      description: |
        STK pushes are always initiated with the platform's Daraja app. A channel only
        decides where the money is routed:
        - `bank`: `bank_code` (from `/v1/banks`) + `account_number` (the bank account credited)
        - `paybill`: `business_number` + optional default `account_number`
        - `till`: `business_number` (Buy Goods)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string, enum: [bank, paybill, till] }
                bank_code: { type: string, description: "Required for bank" }
                business_number: { type: string, pattern: "^\\d{5,7}$", description: "Required for paybill and till" }
                account_number: { type: string, maxLength: 20, description: "Required for bank; optional default for paybill; ignored for till" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/channels/{id}:
    get:
      tags: [channels]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [channels]
      summary: Deactivate a channel (new payments on it are rejected)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Deactivated }

  /v1/webhook:
    get:
      tags: [webhook]
      summary: Get webhook URL and signing secret
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
    put:
      tags: [webhook]
      summary: Set webhook URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
  /v1/webhook/rotate-secret:
    post:
      tags: [webhook]
      summary: Rotate the signing secret (user session only)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
  /v1/webhook/deliveries:
    get:
      tags: [webhook]
      summary: List webhook deliveries
      parameters:
        - { name: payment_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, delivering, delivered, failed, skipped] } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties: { data: { type: array, items: { $ref: "#/components/schemas/Delivery" } } }
  /v1/webhook/deliveries/{id}/redeliver:
    post:
      tags: [webhook]
      summary: Queue a delivery again
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/Delivery" } } } }

  /v1/support/tickets:
    get:
      tags: [support]
      summary: List your support tickets (user session only)
      parameters: [{ $ref: "#/components/parameters/cursor" }, { $ref: "#/components/parameters/limit" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties: { data: { type: array, items: { $ref: "#/components/schemas/Ticket" } } }
    post:
      tags: [support]
      summary: Open a support ticket (user session only; allowed while suspended)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, body]
              properties:
                subject: { type: string, minLength: 3, maxLength: 150 }
                category: { type: string, enum: [payments, channels, webhooks, api, account, billing, other], default: other }
                body: { type: string, maxLength: 10000 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Ticket" } } } }
  /v1/support/tickets/{id}:
    get:
      tags: [support]
      summary: A ticket and its messages
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { $ref: "#/components/schemas/Ticket" }
                  messages: { type: array, items: { $ref: "#/components/schemas/TicketMessage" } }
  /v1/support/tickets/{id}/messages:
    post:
      tags: [support]
      summary: Reply on a ticket (reopens a resolved ticket; closed tickets return 409 ticket_closed)
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/TicketMessage" } } } }
  /v1/support/tickets/{id}/rating:
    post:
      tags: [support]
      summary: Rate a resolved ticket
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties: { rating: { type: integer, minimum: 1, maximum: 5 }, comment: { type: string, maxLength: 1000 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Ticket" } } } }
  /v1/support/feedback:
    post:
      tags: [support]
      summary: Send product feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 5000 }
                rating: { type: integer, minimum: 1, maximum: 5 }
                page: { type: string, description: Dashboard page the feedback was sent from }
      responses:
        "204": { description: Received }

  /v1/notifications:
    get:
      tags: [notifications]
      summary: Dashboard notifications, newest first (user session only)
      parameters:
        - { name: before, in: query, description: created_at of the last item from the previous page (RFC 3339), schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        kind: { type: string, example: support.reply }
                        title: { type: string }
                        body: { type: string }
                        link: { type: string, description: Dashboard path }
                        read_at: { type: string, format: date-time, nullable: true }
                        created_at: { type: string, format: date-time }
  /v1/notifications/unread-count:
    get:
      tags: [notifications]
      summary: Number of unread notifications
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { unread: { type: integer } } } } } }
  /v1/notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Mark one notification read
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Marked }
  /v1/notifications/read-all:
    post:
      tags: [notifications]
      summary: Mark every notification read
      responses:
        "204": { description: Marked }

  /v1/payments:
    post:
      tags: [payments]
      summary: Initiate an STK push (verified)
      description: |
        Returns 201 with status `pending` once Daraja accepts the push, `failed` if Daraja
        rejected it, or `created` if Daraja's response was ambiguous (the final outcome then
        arrives by webhook). Retrying with the same Idempotency-Key and body returns the
        original payment with 200 and `Idempotent-Replayed: true`.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id, amount, phone]
              properties:
                channel_id: { type: string }
                amount: { type: integer, minimum: 1, maximum: 250000, description: Whole KES }
                phone: { type: string, example: "0712345678" }
                account_reference:
                  type: string
                  maxLength: 20
                  description: |
                    bank: omit (always the channel's account_number; a different value is rejected).
                    paybill: overrides the channel default; required if the channel has none.
                    till: optional, defaults to "Till Payment".
                description: { type: string, maxLength: 13, default: Payment }
                metadata: { type: object, additionalProperties: { type: string }, maxProperties: 20 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
        "200": { description: Idempotent replay, content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      tags: [payments]
      summary: List payments
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/PaymentStatus" } }
        - { name: channel_id, in: query, schema: { type: string } }
        - { name: phone, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties: { data: { type: array, items: { $ref: "#/components/schemas/Payment" } } }
  /v1/payments/{id}:
    get:
      tags: [payments]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/payments/{id}/check-status:
    post:
      tags: [payments]
      summary: Ask M-Pesa for a payment's result now
      description: |
        Runs an STK status query immediately instead of waiting for the callback (PayTrack also
        does this automatically when a callback is late). A result is applied exactly like a
        callback: the payment updates and the webhook is sent. Works for `pending` and `expired`
        payments (an expired payment can still become `succeeded`). 6 checks per payment per
        minute. Payments confirmed by a status query have no `mpesa_receipt_number`.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Checked
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: "#/components/schemas/Payment" }
                  outcome: { type: string, enum: [updated, still_processing, unchanged, final, not_queryable] }
                  message: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

webhooks:
  paymentEvent:
    post:
      summary: Payment reached a final (or expired) state
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentEvent" }
      responses:
        "2XX": { description: Acknowledged }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string } }
    cursor: { name: cursor, in: query, schema: { type: string } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: invalid_phone }
                  message: { type: string }
                  request_id: { type: string }
  schemas:
    Ticket:
      type: object
      properties:
        id: { type: string }
        number: { type: integer, description: "Human reference, shown as #1042" }
        subject: { type: string }
        category: { type: string }
        priority: { type: string, enum: [low, normal, high, urgent] }
        status: { type: string, enum: [awaiting_staff, awaiting_user, resolved, closed] }
        last_message_at: { type: string, format: date-time }
        first_response_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        rating: { type: integer, nullable: true }
        rating_comment: { type: string }
        created_at: { type: string, format: date-time }
    TicketMessage:
      type: object
      properties:
        id: { type: string }
        author_kind: { type: string, enum: [user, staff] }
        author_name: { type: string, description: "Your email, or \"Paytrack Support\"" }
        body: { type: string }
        created_at: { type: string, format: date-time }
    Page:
      type: object
      properties:
        has_more: { type: boolean }
        next_cursor: { type: string }
    Tenant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        suspended: { type: boolean, description: "The account is suspended: API keys are paused and the dashboard is read-only." }
        created_at: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner] }
        email_verified: { type: boolean }
        two_step_enabled: { type: boolean }
        has_password: { type: boolean, description: false for Google-only accounts }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }
    Challenge:
      type: object
      properties:
        id: { type: string, example: chl_06gm… }
        masked_email: { type: string, example: "e••••@gmail.com" }
        expires_at: { type: string, format: date-time }
    NotificationSettings:
      type: object
      properties:
        payment_receipts: { type: boolean }
        receipt_email: { type: string }
        receipt_recipient: { type: string, description: Effective address (receipt_email or owner email) }
        webhook_failure_alerts: { type: boolean }
        updated_at: { type: string, format: date-time }
    Session:
      type: object
      description: Also sets the httpOnly pt_refresh cookie.
      properties:
        token: { type: string, description: Access token (15 minutes) }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
        tenant: { $ref: "#/components/schemas/Tenant" }
    APIKey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, example: ptk_a1b2c3 }
        key: { type: string, description: Only present in the create response }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
    APIKeyList:
      type: object
      properties: { data: { type: array, items: { $ref: "#/components/schemas/APIKey" } } }
    Bank:
      type: object
      properties:
        code: { type: string, example: "247247", description: "The bank's PayBill (used as PartyB)" }
        name: { type: string, example: Equity Bank }
    Channel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [bank, paybill, till] }
        business_number: { type: string, description: "PartyB: the bank's PayBill, the PayBill, or the Till" }
        bank_name: { type: string }
        account_number: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    Webhook:
      type: object
      properties:
        url: { type: string }
        signing_secret: { type: string, example: whsec_... }
    PaymentStatus:
      type: string
      enum: [created, pending, succeeded, failed, cancelled, expired]
    Payment:
      type: object
      properties:
        id: { type: string, example: pay_01k7... }
        channel_id: { type: string }
        destination_type: { type: string, enum: [bank, paybill, till], description: Routing snapshot at initiation }
        business_number: { type: string, description: PartyB the money was routed to }
        bank_name: { type: string }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        amount: { type: integer }
        currency: { type: string, enum: [KES] }
        phone: { type: string, example: "254712345678" }
        account_reference: { type: string }
        description: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        merchant_request_id: { type: string }
        checkout_request_id: { type: string }
        mpesa_receipt_number: { type: string, description: Empty if the result was learned via status query }
        result_code: { type: integer }
        result_desc: { type: string }
        failure_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    PaymentEvent:
      type: object
      properties:
        id: { type: string, example: evt_01k7... }
        type: { type: string, enum: [payment.succeeded, payment.failed, payment.cancelled, payment.expired] }
        tenant_id: { type: string }
        created_at: { type: string, format: date-time }
        data: { $ref: "#/components/schemas/Payment" }
    Delivery:
      type: object
      properties:
        id: { type: string }
        event_id: { type: string }
        event_type: { type: string }
        payment_id: { type: string }
        status:
          type: string
          enum: [pending, delivering, delivered, failed, skipped]
          description: "`skipped`: no webhook URL was set when the event happened; nothing was sent. Redeliver after setting one."
        attempts: { type: integer }
        next_attempt_at: { type: [string, "null"], format: date-time }
        last_error: { type: string }
        last_status_code: { type: integer }
        delivered_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        payload: { $ref: "#/components/schemas/PaymentEvent" }
